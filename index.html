<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08090d">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Nathan Foale's website is being updated and will be back soon.">
    <title>Nathan Foale | Back Soon</title>
    <meta property="og:title" content="Nathan Foale | Back Soon">
    <meta property="og:description" content="The site is taking a short pause while a few changes are made.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nathan Foale">
    <meta property="og:url" content="https://www.nathanfoale.com/">
    <meta property="og:image" content="https://www.nathanfoale.com/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://www.nathanfoale.com/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body class="maintenance-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header maintenance-header">
      <a class="brand" href="#main" aria-label="Nathan Foale, back to the message">
        <img src="/assets/nf-logo-mark-header.png" alt="" aria-hidden="true">
      </a>
      <p class="maintenance-header__label"><span aria-hidden="true"></span>Site update in progress</p>
    </header>

    <main class="maintenance-main" id="main">
      <section class="hero maintenance-hero" aria-labelledby="maintenance-title">
        <canvas class="hero-particle-canvas" data-hero-particles aria-hidden="true"></canvas>
        <div class="hero-glow" aria-hidden="true"></div>

        <div class="hero-copy reveal">
          <p class="eyebrow"><span aria-hidden="true"></span>Nathan Foale / Portfolio</p>
          <h1 id="maintenance-title">I’ll be back<br><em>soon.</em></h1>
          <p class="hero-intro">A few changes are underway. The site is taking a short pause and will return shortly.</p>
          <p class="maintenance-note">Thanks for stopping by.</p>
        </div>

        <div class="system-visual reveal" aria-label="An animated illustrated portrait of Nathan Foale within an interactive orbital field">
          <canvas class="system-canvas" data-system-canvas aria-hidden="true"></canvas>
          <div class="portrait-wrap" aria-hidden="true">
            <img src="/assets/nathan-portrait-transparent.png" alt="" width="1122" height="1402">
            <span class="portrait-scan"></span>
          </div>
          <p class="visual-caption">Move or tap to interact</p>
        </div>
      </section>
    </main>

    <footer class="maintenance-footer">
      <p>© <span data-year>2026</span> Nathan Foale</p>
      <p>Ideas, models &amp; systems</p>
    </footer>
  </body>
</html>
